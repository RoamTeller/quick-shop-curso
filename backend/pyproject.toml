[project]
name = "quickshop-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
 "sqlalchemy>=2.0.40,<3", "alembic>=1.15,<2",
 "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3",
 "email-validator>=2.1.0,<3", "PyJWT>=2.10,<3", "bcrypt>=4.3,<6"
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
